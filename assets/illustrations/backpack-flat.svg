<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 400" width="360" height="400" role="img" aria-labelledby="t"><title id="t">A hiking backpack packed with a laptop, a map and a pole</title>
<style>.body{fill:var(--illo-body,#006636)}.body2{fill:var(--illo-body2,#00522a)}.lid{fill:var(--illo-lid,#417703)}.dark{fill:var(--illo-dark,#3d3f44)}.tint{fill:var(--illo-tint,#dff3e4)}.tool{fill:var(--illo-tool,#f6f7f4)}.mat{fill:var(--illo-mat,#70aa43)}</style>
<!-- straps behind -->
<polygon class="dark" points="110,150 130,150 120,60 100,60"/><polygon class="dark" points="250,150 230,150 240,60 260,60"/>
<!-- contents poking out -->
<rect class="tool" x="126" y="36" width="108" height="72"/><rect class="dark" x="134" y="44" width="92" height="52"/><rect class="tint" x="142" y="52" width="40" height="5"/><rect class="tint" x="142" y="64" width="60" height="5"/><rect class="tint" x="142" y="76" width="28" height="5"/>
<rect class="dark" x="292" y="30" width="8" height="150"/><polygon class="tool" points="284,30 308,30 296,10"/>
<polygon class="tint" points="60,110 100,60 116,110"/><rect class="tint" x="60" y="110" width="56" height="10"/>
<!-- rolled mat -->
<rect class="mat" x="96" y="108" width="168" height="34"/><rect class="body2" x="96" y="108" width="12" height="34"/><rect class="body2" x="252" y="108" width="12" height="34"/>
<!-- main body -->
<polygon class="body" points="80,142 280,142 292,370 68,370"/>
<!-- lid -->
<polygon class="lid" points="72,142 288,142 296,190 64,190"/>
<rect class="dark" x="160" y="182" width="40" height="18"/>
<!-- side pockets -->
<polygon class="body2" points="68,240 104,240 104,330 74,330"/><polygon class="body2" points="292,240 256,240 256,330 286,330"/>
<!-- front pocket -->
<rect class="body2" x="116" y="230" width="128" height="110"/><rect class="tint" x="116" y="230" width="128" height="22"/>
<rect class="tint" x="128" y="270" width="104" height="6"/><rect class="tint" x="128" y="288" width="72" height="6"/>
<!-- bottom strap and hip belt -->
<rect class="dark" x="68" y="356" width="224" height="14"/>
<polygon class="dark" points="40,330 68,320 68,350 40,360"/><polygon class="dark" points="320,330 292,320 292,350 320,360"/>
</svg>
