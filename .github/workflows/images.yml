# Fails a PR that commits an oversized image.
# Budgets live in bin/check-image-sizes (also run by the lefthook pre-commit hook).
name: Image sizes

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sizes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: bin/check-image-sizes
