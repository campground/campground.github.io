# Builds the site the same way pages.yml does, then runs Lighthouse CI against it.
# Thresholds live in .lighthouserc.json; reports are attached to the run as an artifact.
name: Lighthouse

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lighthouse:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version-file: .tool-versions
          cache: npm
      - run: npm ci
      - run: npm run build:css
      - uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true
      - run: bundle exec jekyll build
        env:
          JEKYLL_ENV: production
      # Serves _site with gzip and runs Lighthouse (mobile) three times.
      - run: npx --yes @lhci/cli@0.15.1 autorun
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: lighthouse-reports
          path: .lighthouseci/
          include-hidden-files: true
