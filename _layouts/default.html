<!doctype html>
<html lang="en" data-theme="green">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    {% seo %}
    <link rel="icon" href="{{ '/assets/logos/Campground-Icon-Green.svg' | relative_url }}" type="image/svg+xml">
    <link rel="preload" href="{{ '/assets/fonts/Arvo-Regular.woff2' | relative_url }}" as="font" type="font/woff2" crossorigin>
    <link rel="stylesheet" href="{{ '/assets/css/site.css' | relative_url }}">
  </head>
  <body class="bg-surface text-ink antialiased">
    <a href="#main" class="sr-only focus:not-sr-only focus:absolute focus:top-2 focus:left-2 focus:z-50 focus:bg-surface-raised focus:px-4 focus:py-2 focus:text-brand-600 focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-brand-600">Skip to content</a>
    <header class="border-b border-line bg-surface-raised">
      <nav aria-label="Global" class="mx-auto flex max-w-7xl items-center justify-between gap-x-4 px-6 py-4 sm:gap-x-8 lg:px-8">
        <a href="{{ '/' | relative_url }}" class="inline-flex min-h-11 shrink-0 items-center focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-focus">
          <img src="{{ '/assets/logos/Campground-Digital-Green.svg' | relative_url }}" alt="Campground Digital" width="792" height="326" class="h-10 w-auto sm:h-14">
        </a>
        <div class="hidden items-center gap-x-10 md:flex">
          <a href="{{ '/#services' | relative_url }}" class="inline-flex min-h-11 items-center text-sm/6 font-semibold text-ink hover:text-brand-600 focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-brand-600">Services</a>
          <a href="{{ '/#how-we-work' | relative_url }}" class="inline-flex min-h-11 items-center text-sm/6 font-semibold text-ink hover:text-brand-600 focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-brand-600">How we work</a>
          <a href="{{ '/#run-improve' | relative_url }}" class="inline-flex min-h-11 items-center text-sm/6 font-semibold text-ink hover:text-brand-600 focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-brand-600">Run + improve</a>
        </div>
        <a href="{{ '/#contact' | relative_url }}" class="inline-flex min-h-11 items-center rounded-xs bg-brand-600 px-4 font-label whitespace-nowrap sm:px-5 text-label text-on-brand-deep uppercase hover:bg-brand-700 focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-brand-600">Start a project</a>
      </nav>
    </header>

    <main id="main">
      {{ content }}
    </main>

    <footer class="border-t border-line bg-surface-raised">
      <div class="mx-auto flex max-w-7xl flex-col gap-8 px-6 py-12 md:flex-row md:items-end md:justify-between lg:px-8">
        <div class="max-w-sm">
          <img src="{{ '/assets/logos/Campground-Icon-Green.svg' | relative_url }}" alt="" width="64" height="36" class="h-9 w-auto">
          <p class="mt-4 text-sm/6 text-balance text-ink-muted">Campground Digital designs, builds and runs software for companies that can't afford it to fail.</p>
        </div>
        <div class="text-sm/6 text-ink-muted md:text-right">
          <a href="mailto:{{ site.email }}" class="inline-flex min-h-11 items-center font-semibold text-brand-600 hover:text-brand-700 focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-brand-600">{{ site.email }}</a>
          <p class="mt-2">&copy; {{ site.time | date: '%Y' }} Campground Digital</p>
        </div>
      </div>
    </footer>
  </body>
</html>
