# GitHub Pages + Jekyll site settings
# https://docs.github.com/en/pages/quickstart
# No gem theme: layouts live in _layouts/, CSS comes from Tailwind.
theme: null
title: Campground
tagline: Digital agency and consultancy
description: >-
  Campground is a full-service digital agency and consultancy. We build web and
  mobile applications and automate workflows with AI.
logo: /assets/logos/Campground-Digital-Green.png
lang: en
# Contact address used by every "Start a project" link.
email: hello@campgrounddd.com
url: https://www.campgrounddd.com
baseurl: ""

# Both ship with the github-pages gem. robots.txt is our own (jekyll-sitemap skips its stub).
plugins:
  - jekyll-seo-tag
  - jekyll-sitemap

exclude:
  # Plate masters and prompt sidecars stay in the repo for provenance; only the WebP plates ship.
  - assets/plates/*.json
  - assets/plates/*.png
  - Gemfile
  - Gemfile.lock
  - README.md
  - PRODUCT.md
  - DESIGN.md
  - node_modules
  - package.json
  - package-lock.json
  - vendor

# Social card for every page (jekyll-seo-tag reads page.image).
defaults:
  - scope:
      path: ""
    values:
      image: /assets/og.jpg
